name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-vet:
    name: Lint & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.23.2'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          diff -u <(echo -n) <(gofmt -d -s .)

      - name: Go Vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6.1.1
        with:
          version: v1.61.0
          args: --timeout=5m --verbose

  test:
    name: Race Detector & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.23.2'
          cache: true

      - name: Run Unit & Race Tests
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Run Benchmark Smoke Test
        run: |
          go test -bench="." -run="^$" ./internal

  security:
    name: Vulnerability Audit (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.23.2'
          cache: true

      - name: Install and Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Build Container Image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: false
          tags: surfacewatch:latest
